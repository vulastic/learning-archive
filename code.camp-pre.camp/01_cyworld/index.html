<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>vulastic의 미니홈피 :: 사이좋은 사람들, 싸이월드</title>
    <link href="./styles/style.css" rel="stylesheet">
    <link href="./styles/common.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&icon_names=call,face,mail,star&display=block" rel="stylesheet"/>
    <script src="index.js" defer></script>
</head>
<body>
    <div id="outerbox">
        <div id="frame">
            <div id="wrapper">
                <p id="wrapper__left__header">
                    <span>TODAY</span>
                    <span class="number_display">0</span>
                    <span>|</span>
                    <span>TOTAL</span>
                    <span class="number_display">12345</span>
                </p>
                <div id="wrapper__left__body">
                    <div id="left__photo"></div>
                    <div id="left__profile">
                        <p>
                            <span class="material-symbols-outlined">face</span>
                            <span>이름</span>
                        </p>
                        <p>
                            <span class="material-symbols-outlined">call</span>
                            <span>Phone</span>
                        </p>
                        <p>
                            <span class="material-symbols-outlined">mail</span>
                            <span>E-mail</span>
                        </p>
                        <p>
                            <span class="material-symbols-outlined">star</span>
                            <span>인스타그램</span>
                        </p>
                    </div>
                    <div id="left__footer">
                        <p>오늘의 기분</p>
                        <select>
                            <option value="happy">기쁨 😊</option>
                            <option value="sad">슬픔 😭</option>
                            <option value="mad">화남 😠</option>
                            <option value="think">생각중 🤔</option>
                        </select>
                    </div>
                </div>
                <p id="wrapper__right__header">
                    <span class="title">사이좋은 사람들, 싸이월드</span>
                    <span class="privacy">사생활보호설정</span>
                    <span class="privacy_arrow">▶</span>
                </p>
                <div id="wrapper__right__body">
                    <iframe id="innerframe" src="./home.html"></iframe>
                </div>
                <div id="wrapper__navigation">
                    <div id="navigation__home" class="navigation__item navigation__selected">홈</div>
                    <div id="navigation__jukebox" class="navigation__item">주크박스</div>
                    <div id="navigation__game" class="navigation__item">게임</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
