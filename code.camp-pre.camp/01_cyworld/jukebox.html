<!DOCTYPE html>
<html lang="ko">
<head>
    <title>Jukebox</title>
    <link href="./styles/jukebox.css" rel="stylesheet">
    <link href="./styles/common.css" rel="stylesheet">
</head>
<body>
    <div id="wrapper">
        <div id="wrapper__favorite">
            <p class="contents__title">
                <span class="title">추억의 BGM</span>
                <span class="subtitle">TODAY CHOICE</span>
            </p>
            <hr>
            <div id="favorite__contents">
                <div class="favorite__album">
                    <div class="album__wrapper">
                        <img src="./images/album_freestyle.jpg">
                    </div>
                    <p class="album__title">Y(Please Tell Me Why)</p>
                    <p class="album__artist">프리스타일</p>
                </div>
                <div class="favorite__album">
                    <div class="album__wrapper">
                        <img src="./images/album_park.jpg">
                    </div>
                    <p class="album__title">눈의 꽃</p>
                    <p class="album__artist">박효신</p>
                </div>
                <div class="favorite__album">
                    <div class="album__wrapper">
                        <img src="./images/album_yoon.jpg">
                    </div>
                    <p class="album__title">사랑했나봐</p>
                    <p class="album__artist">윤도현</p>
                </div>
            </div>
        </div>
        <div id="wrapper__list">
            <p class="contents__title">
                <span class="title">추억의 BGM</span>
                <span class="subtitle">TODAY CHOICE</span>
            </p>
            <table id="list__contents">
                <thead>
                    <tr>
                        <th><input type="checkbox"></th>
                        <th>번호</th>
                        <th>곡명</th>
                        <th>아티스트</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><input type="checkbox"></td>
                        <td>1</td>
                        <td>눈의 꽃</td>
                        <td>박효신</td>
                    </tr>
                    <tr>
                        <td><input type="checkbox"></td>
                        <td>2</td>
                        <td>사랑스러워</td>
                        <td>김종국</td>
                    </tr>
                    <tr>
                        <td><input type="checkbox"></td>
                        <td>3</td>
                        <td>내사람: Partner For Life</td>
                        <td>SG 워너비</td>
                    </tr>
                    <tr>
                        <td><input type="checkbox"></td>
                        <td>4</td>
                        <td>Love Love Love</td>
                        <td>에픽하이</td>
                    </tr>
                    <tr>
                        <td><input type="checkbox"></td>
                        <td>5</td>
                        <td>애인...있어요</td>
                        <td>이은미</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
