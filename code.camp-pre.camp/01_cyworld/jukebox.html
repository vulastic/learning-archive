<!DOCTYPE html>
<html lang="ko">
<head>
    <title>Jukebox</title>
    <link href="./styles/common.css" rel="stylesheet">
    <link href="./styles/jukebox.css" rel="stylesheet">
</head>
<body>
    <div id="wrapper">
        <div id="wrapper__favorite">
            <div class="contents__title">
                <span class="title">추억의 BGM</span>
                <span class="subtitle">TODAY CHOICE</span>
            </div>
            <hr>
            <div id="favorite__contents">
                <div class="favorite__album">
                    <div class="album__wrapper">
                        <img src="./images/album_freestyle.jpg" alt="Y(Please Tell Me Why)">
                    </div>
                    <p class="album__title">Y(Please Tell Me Why)</p>
                    <p class="album__artist">프리스타일</p>
                </div>
                <div class="favorite__album">
                    <div class="album__wrapper">
                        <img src="./images/album_park.jpg" alt="눈의 꽃">
                    </div>
                    <p class="album__title">눈의 꽃</p>
                    <p class="album__artist">박효신</p>
                </div>
                <div class="favorite__album">
                    <div class="album__wrapper">
                        <img src="./images/album_yoon.jpg" alt="사랑했나봐">
                    </div>
                    <p class="album__title">사랑했나봐</p>
                    <p class="album__artist">윤도현</p>
                </div>
            </div>
        </div>
        <div id="wrapper__list">
            <div class="contents__title">
                <span class="title">추억의 BGM</span>
                <span class="subtitle">TODAY CHOICE</span>
            </div>
            <table id="list__contents">
                <thead>
                    <tr>
                        <th class="column_checkbox"><input type="checkbox"></th>
                        <th class="column_number">번호</th>
                        <th class="column_title">곡명</th>
                        <th class="column_artist">아티스트</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="column_checkbox"><input type="checkbox"></td>
                        <td class="column_number">1</td>
                        <td class="column_title">눈의 꽃</td>
                        <td class="column_artist">박효신</td>
                    </tr>
                    <tr>
                        <td class="column_checkbox"><input type="checkbox"></td>
                        <td class="column_number">2</td>
                        <td class="column_title">사랑스러워</td>
                        <td class="column_artist">김종국</td>
                    </tr>
                    <tr>
                        <td class="column_checkbox"><input type="checkbox"></td>
                        <td class="column_number">3</td>
                        <td class="column_title">내사람: Partner For Life</td>
                        <td class="column_artist">SG 워너비</td>
                    </tr>
                    <tr>
                        <td class="column_checkbox"><input type="checkbox"></td>
                        <td class="column_number">4</td>
                        <td class="column_title">Love Love Love</td>
                        <td class="column_artist">에픽하이</td>
                    </tr>
                    <tr>
                        <td class="column_checkbox"><input type="checkbox"></td>
                        <td class="column_number">5</td>
                        <td class="column_title">애인...있어요</td>
                        <td class="column_artist">이은미</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
