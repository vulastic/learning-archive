<!DOCTYPE html>
<html lang="ko">
<head>
    <title>Game</title>
    <link href="./styles/common.css" rel="stylesheet">
    <link href="./styles/game.css" rel="stylesheet">
    <script src="game.js" defer></script>
</head>
<body>
    <div id="wrapper">
        <div id="wrapper__game">
            <div class="contents__title">
                <span class="title">GAME</span>
                <span class="subtitle">TODAY CHOICE</span>
            </div>
            <hr>
            <div id="game__contents">
                <div class="game__container">
                    <img src="./images/train.png" alt="끝말잇기">
                    <p class="game__title">끝말잇기</p>
                    <p class="game__subtitle">제시어 : <span id="word">뉴비즈코드</span></p>
                    <div class="game__answer">
                        <input id="word_input" class="game__word__text" type="text" placeholder="단어를 입력하세요.">
                        <button id="word_button" class="game__word__button">입력</button>
                    </div>
                    <p id="word_result">결과!</p>
                </div>
                <div class="game__container">
                    <img src="./images/lotto.png" alt="로또추첨">
                    <p class="game__title">LOTTO</p>
                    <p class="gmae__subtitle">버튼을 누르세요.</p>
                    <p id="lotto_result" class="game__lotto__numbers"></p>
                    <button id="lotto_button" class="game__lotto__button">추첨</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
